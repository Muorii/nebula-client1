      - name: Passende Fabric-Versionen eintragen
        working-directory: src
        run: python3 update_versions.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Bauen
        working-directory: src
        run: gradle build --no-daemon
      - name: Fabric API holen und Release erstellen
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(grep '^fabric_version=' gradle.properties | cut -d= -f2)
          curl -fsSL -o build/libs/fabric-api.jar "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${V}/fabric-api-${V}.jar"
          rm -f build/libs/*-sources.jar
          gh release create "build-${{ github.run_number }}" build/libs/*.jar --repo "${{ github.repository }}" --title "Nebula Client Build ${{ github.run_number }}" --notes "nebula-client + fabric-api in den mods-Ordner"
